[build-system]
requires = ["setuptools>=75,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "nissan-note-safescan"
version = "0.1.0"
description = "Read-only, evidence-preserving OBD-II diagnostics for Windows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Nissan Note SafeScan contributors" },
]
dependencies = [
  "PySide6>=6.7,<7",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = [
  "mypy==1.13.0",
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "ruff==0.7.1",
]

[project.scripts]
notescan = "notescan.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notescan = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]
markers = [
  "hardware: requires a connected OBDLink adapter and vehicle (excluded from CI)",
]

[tool.coverage.run]
branch = true
source = ["notescan"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["notescan"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true
warn_unused_configs = true
